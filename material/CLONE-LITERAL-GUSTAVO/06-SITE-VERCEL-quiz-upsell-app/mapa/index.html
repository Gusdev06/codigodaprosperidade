<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa Astral da Prosperidade</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:radial-gradient(ellipse at top,#2a1240 0%,#120818 45%,#0a0510 100%);min-height:100vh;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif;padding-bottom:110px}.wrap{max-width:420px;margin:0 auto;padding:28px 20px}.gold{color:#e8c46a}h1{font-size:34px;font-weight:800;text-align:center;line-height:1.15}.sub{text-align:center;color:#b9b0c6;font-size:17px;line-height:1.5;margin:22px 0 40px}.btn{display:block;width:100%;text-align:center;padding:20px;border-radius:999px;font-size:18px;font-weight:700;text-decoration:none;margin-bottom:16px}.btn-gold{background:linear-gradient(90deg,#e6b95c,#f2d78a);color:#1a0f28;box-shadow:0 0 26px rgba(232,196,106,.35)}.btn-outline{border:1px solid #8a3fbf;color:#fff;background:rgba(60,20,90,.25)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}.card{border:1px solid #3a2550;border-radius:18px;background:rgba(40,20,60,.35);padding:22px 8px;text-align:center;color:#c9c0d6;font-size:15px;line-height:1.3;text-decoration:none}.card .ic{font-size:36px;display:block;margin-bottom:12px}nav.tab{position:fixed;left:0;right:0;bottom:0;background:#0b0710;border-top:1px solid #2a1c3a;display:flex;justify-content:space-around;padding:14px 0 22px}nav.tab a{color:#a99cbb;text-decoration:none;font-size:15px;text-align:center}nav.tab a span{display:block;font-size:26px;margin-bottom:4px}nav.tab a.on{color:#e8c46a}.day{display:flex;align-items:center;gap:18px;border:1px solid #2e2040;border-radius:18px;padding:18px;margin-bottom:14px;background:rgba(40,20,60,.3);text-decoration:none;color:#fff}.day .n{width:52px;height:52px;border-radius:50%;background:#e8c46a;color:#1a0f28;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:0 0 52px}
