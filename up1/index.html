<script>
document.addEventListener("DOMContentLoaded", function() {
/* ALTERE O VALOR 10 PARA OS SEGUNDOS EM QUE AS SEÇÕES VÃO APARECER */
    var SECONDS_TO_DISPLAY = 385;
    var CLASS_TO_DISPLAY = ".esconder";
/* DAQUI PARA BAIXO NAO PRECISA ALTERAR */
    var EXPIRATION_DAYS = 14;
    var alreadyDisplayedKey = "alreadyElsDisplayed" + SECONDS_TO_DISPLAY;
    var elsHidden = document.querySelectorAll(CLASS_TO_DISPLAY);
    var elsDisplayed = false;
    class StorageHandler {
        static expiryTime = EXPIRATION_DAYS * 86400000;
        static set(key, value) { localStorage.setItem(key, JSON.stringify({ value, expiry: Date.now() + this.expiryTime })); }
        static get(key) {
            var item = localStorage.getItem(key);
            if (!item) return null;
            var { value, expiry } = JSON.parse(item);
            if (Date.now() > expiry) { localStorage.removeItem(key); return null; }
            return value;
        }
    }


    var alreadyElsDisplayed = StorageHandler.get(alreadyDisplayedKey);
    var showHiddenElements = function () {
        if (elsDisplayed) return;
        elsDisplayed = true;
        elsHidden.forEach((e) => e.style.display = "block");
        StorageHandler.set(alreadyDisplayedKey, true);
    };

    /* Player vturb (vid-6aa567c1b554c32c63a5e826). Tenta ler o tempo real do vídeo
       pela API do smartplayer; se a API não aparecer em ~20 s, cai pro relógio de
       parede contado a partir do carregamento da página. */
    var enganchou = false, tentativas = 0;
    var polling = setInterval(function () {
        tentativas++;
        try {
            var sp = window.smartplayer;
            var inst = sp && (sp.instances ? (sp.instances[0] || sp.instances["vid-6aa567c1b554c32c63a5e826"]) : sp);
            if (inst && typeof inst.on === "function") {
                enganchou = true;
                clearInterval(polling);
                inst.on("timeupdate", function () {
                    if (elsDisplayed) return;
                    var t = (inst.video && inst.video.currentTime) || inst.currentTime || 0;
                    if (t >= SECONDS_TO_DISPLAY) showHiddenElements();
                });
                return;
            }
        } catch (e) {}
        if (tentativas > 40) {
            clearInterval(polling);
            if (!enganchou) setTimeout(showHiddenElements, SECONDS_TO_DISPLAY * 1000);
        }
    }, 500);

    if (alreadyElsDisplayed) { setTimeout(showHiddenElements, 100); }
});
</script>
